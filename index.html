<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帶團記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2ec;
  --surface: #fdfcf9;
  --surface2: #f0ede6;
  --border: #ddd9d0;
  --border2: #c8c3b8;
  --text: #1a1916;
  --text2: #6b6760;
  --text3: #9e9a93;
  --accent: #c8440a;
  --accent-light: #f5e6df;
  --accent-dark: #8f2e05;
  --green: #2d6a4f;
  --green-light: #e0f0e8;
  --red: #c0392b;
  --red-light: #fde8e6;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans TC', sans-serif;
  --radius: 8px;
  --radius-lg: 14px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* ── LAYOUT ── */
.app { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 0 12px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.topbar-title {
  font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
  display: flex; align-items: center; gap: 8px;
}
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius);
  border: 1px solid var(--border2); background: var(--surface);
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  color: var(--text); cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface2); border-color: var(--text3); }
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--accent); border-color: var(--accent-dark);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text2); }
.btn-ghost:hover { background: var(--surface2); border-color: var(--border); color: var(--text); }
.btn-danger { color: var(--red); border-color: #e8b5b0; }
.btn-danger:hover { background: var(--red-light); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 12px;
}
.card-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text3);
  margin-bottom: 14px;
}

/* ── STAT ROW ── */
.stat-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 20px;
}
.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.stat-box .sl { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.stat-box .sv { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--text); }

/* ── TOUR LIST ── */
.tour-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.1s;
  border-radius: 0;
}
.tour-item:last-child { border-bottom: none; }
.tour-item:hover .ti-name { color: var(--accent); }
.ti-left { display: flex; flex-direction: column; gap: 3px; }
.ti-name { font-size: 15px; font-weight: 600; color: var(--text); transition: color 0.15s; }
.ti-meta { font-size: 12px; color: var(--text3); font-family: var(--mono); }
.ti-right { text-align: right; }
.ti-amount { font-size: 17px; font-weight: 700; font-family: var(--mono); color: var(--text); }
.ti-currency { font-size: 11px; color: var(--text3); }
.empty-state {
  text-align: center; padding: 48px 16px;
  color: var(--text3); font-size: 14px; line-height: 2;
}
.empty-icon { font-size: 40px; margin-bottom: 8px; }

/* ── FORM ── */
.form-section { margin-bottom: 24px; }
.form-section-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text3);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--text2); }
.field input, .field textarea, .field select {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  transition: border-color 0.15s;
  width: 100%;
}
.field input:focus, .field textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.field textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
.field .hint { font-size: 11px; color: var(--text3); }
.badge {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 1px 7px; border-radius: 20px;
  font-family: var(--mono);
  vertical-align: middle; margin-left: 4px;
}
.badge-twd { background: var(--green-light); color: var(--green); }
.badge-jpy { background: #fff3e0; color: #c67000; }
.badge-out { background: var(--red-light); color: var(--red); }

/* ── RESULT BOX ── */
.result-box {
  background: var(--text);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin: 16px 0;
  color: var(--bg);
}
.result-box .rl { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; margin-bottom: 4px; }
.result-box .rv { font-size: 32px; font-weight: 700; font-family: var(--mono); color: #fff; }
.result-box .rb { font-size: 11px; opacity: 0.55; margin-top: 6px; font-family: var(--mono); line-height: 1.5; }

/* ── RATE ROW ── */
.rate-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2); border-radius: var(--radius);
  padding: 10px 14px; margin-bottom: 6px;
}
.rate-row label { font-size: 12px; color: var(--text2); white-space: nowrap; font-weight: 500; }
.rate-row input {
  width: 80px; padding: 5px 8px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  font-size: 14px; font-family: var(--mono);
}
.rate-row input:focus { outline: none; border-color: var(--accent); }
.rate-row .hint { font-size: 11px; color: var(--text3); }

/* ── DETAIL VIEW ── */
.detail-header { margin-bottom: 20px; }
.detail-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.detail-meta { font-size: 13px; color: var(--text3); font-family: var(--mono); }
.detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
.detail-col-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 10px;
}
.detail-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.detail-row:last-child { border-bottom: none; }
.detail-row .dl { color: var(--text2); }
.detail-row .dv { font-weight: 600; font-family: var(--mono); color: var(--text); }
.note-box {
  background: var(--surface2); border-radius: var(--radius);
  padding: 12px 16px; font-size: 13px; line-height: 1.7;
  color: var(--text); margin-top: 4px;
}

/* ── BACK BTN ── */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text3); cursor: pointer;
  background: none; border: none; font-family: var(--sans);
  padding: 0 0 16px; transition: color 0.15s;
}
.back-btn:hover { color: var(--accent); }

/* ── DIVIDER ── */
.btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ── VIEWS ── */
#view-list, #view-form, #view-detail { display: none; }
#view-list.active, #view-form.active, #view-detail.active { display: block; }

/* ── MOBILE ── */
@media (max-width: 480px) {
  .stat-row { grid-template-columns: 1fr 1fr; }
  .stat-row .stat-box:last-child { grid-column: span 2; }
  .field-grid, .field-grid.three { grid-template-columns: 1fr; }
  .detail-cols { grid-template-columns: 1fr; gap: 0; }
  .result-box .rv { font-size: 26px; }
}

/* ── FILTER BAR ── */
.filter-bar {
  display: flex; gap: 8px; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap;
}
.filter-bar select {
  padding: 7px 12px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-family: var(--sans); font-size: 13px;
  cursor: pointer;
}
.filter-bar select:focus { outline: none; border-color: var(--accent); }
.filter-reset {
  font-size: 12px; color: var(--text3); cursor: pointer;
  background: none; border: none; font-family: var(--sans);
  padding: 4px 8px; border-radius: var(--radius);
}
.filter-reset:hover { color: var(--accent); background: var(--accent-light); }
.filter-result {
  font-size: 12px; color: var(--text3); margin-left: auto;
  font-family: var(--mono);
}

/* ── ANIMATIONS ── */
@keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
.card, .stat-box, .tour-item { animation: fadeIn 0.2s ease both; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title">
      <span class="logo-dot"></span>
      帶團記帳
    </div>
    <div id="topbar-actions"></div>
  </div>

  <!-- LIST VIEW -->
  <div id="view-list">
    <div id="stat-summary" style="display:none">
      <div class="stat-row">
        <div class="stat-box"><div class="sl">篩選團次</div><div class="sv" id="stat-count">0</div></div>
        <div class="stat-box"><div class="sl">篩選收入（TWD）</div><div class="sv" id="stat-total">$0</div></div>
        <div class="stat-box"><div class="sl">平均每團</div><div class="sv" id="stat-avg">$0</div></div>
      </div>
    </div>
    <div class="filter-bar">
      <select id="filter-year" onchange="renderList()"></select>
      <select id="filter-month" onchange="renderList()">
        <option value="">全部月份</option>
        <option value="01">1月</option><option value="02">2月</option>
        <option value="03">3月</option><option value="04">4月</option>
        <option value="05">5月</option><option value="06">6月</option>
        <option value="07">7月</option><option value="08">8月</option>
        <option value="09">9月</option><option value="10">10月</option>
        <option value="11">11月</option><option value="12">12月</option>
      </select>
      <button class="filter-reset" onclick="resetFilter()">重設</button>
      <span class="filter-result" id="filter-result"></span>
    </div>
    <div class="card">
      <div class="card-label" id="list-label">所有團次</div>
      <div id="tour-list">
        <div class="empty-state">
          <div class="empty-icon">✈️</div>
          還沒有紀錄<br>點右上角「新增團次」開始
        </div>
      </div>
    </div>
  </div>

  <!-- FORM VIEW -->
  <div id="view-form">
    <button class="back-btn" onclick="showView('list')">← 返回列表</button>
    <div class="card">
      <div class="form-section">
        <div class="form-section-title">基本資料</div>
        <div class="field-grid">
          <div class="field">
            <label>A &nbsp;帶團日期</label>
            <input type="date" id="f-date">
          </div>
          <div class="field">
            <label>B &nbsp;團名</label>
            <input type="text" id="f-name" placeholder="例：東京五日團">
          </div>
        </div>
        <div style="margin-top:10px">
          <div class="field" style="max-width:180px">
            <label>C &nbsp;團員人數</label>
            <input type="number" id="f-pax" placeholder="0" min="0">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">收入項目</div>
        <div class="field-grid">
          <div class="field">
            <label>D &nbsp;小費 <span class="badge badge-twd">TWD</span></label>
            <input type="number" id="f-tips" placeholder="0" min="0">
            <span class="hint">直接填台幣金額</span>
          </div>
          <div class="field">
            <label>E &nbsp;車販業績 <span class="badge badge-jpy">JPY</span></label>
            <input type="number" id="f-sales" placeholder="0" min="0">
          </div>
        </div>
        <div class="field-grid" style="margin-top:10px">
          <div class="field">
            <label>F &nbsp;進店業績 <span class="badge badge-jpy">JPY</span></label>
            <input type="number" id="f-shop" placeholder="0" min="0">
          </div>
          <div class="field">
            <label>J &nbsp;額外收入 <span class="badge badge-twd">TWD</span></label>
            <input type="number" id="f-extra" placeholder="0（選填）" min="0">
            <span class="hint">台幣直接填入</span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">支出項目</div>
        <div class="field-grid">
          <div class="field">
            <label>G &nbsp;補藥 <span class="badge badge-out">支出 JPY</span></label>
            <input type="number" id="f-meds" placeholder="0（選填）" min="0">
            <span class="hint">導遊自貼補業績</span>
          </div>
          <div class="field">
            <label>H &nbsp;茶水費（給司機）<span class="badge badge-out">支出 JPY</span></label>
            <input type="number" id="f-water" placeholder="0" min="0">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">匯率設定</div>
        <div class="rate-row">
          <label>I &nbsp;匯率 &nbsp;1 JPY =</label>
          <input type="number" id="f-rate" value="0.21" step="0.001" min="0.01">
          <span style="font-size:13px;color:var(--text2);font-weight:500">TWD</span>
          <span class="hint">預設 0.21，可自行調整</span>
        </div>
        <div class="result-box">
          <div class="rl">K &nbsp;總收入（台幣）</div>
          <div class="rv" id="f-total">$0</div>
          <div class="rb" id="f-breakdown">請填入數值後自動計算</div>
        </div>
      </div>

      <div class="form-section" style="margin-bottom:0">
        <div class="form-section-title">備註</div>
        <div class="field">
          <label>L &nbsp;備註欄</label>
          <textarea id="f-note" placeholder="例：日本製鈣片 12 瓶、護膝 5 組、保健品共 20 件..."></textarea>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" onclick="showView('list')">取消</button>
        <button class="btn btn-primary" onclick="saveTour()">✓ &nbsp;儲存</button>
      </div>
    </div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="view-detail">
    <button class="back-btn" onclick="showView('list')">← 返回列表</button>
    <div class="card">
      <div class="detail-header">
        <div class="detail-title" id="d-name"></div>
        <div class="detail-meta" id="d-meta"></div>
      </div>

      <div class="result-box" style="margin-top:0">
        <div class="rl">K &nbsp;總收入（台幣）</div>
        <div class="rv" id="d-total"></div>
        <div class="rb" id="d-breakdown"></div>
      </div>

      <div class="detail-cols">
        <div>
          <div class="detail-col-title">收入項目</div>
          <div class="detail-row"><span class="dl">D &nbsp;小費</span><span class="dv" id="d-tips"></span></div>
          <div class="detail-row"><span class="dl">E &nbsp;車販業績</span><span class="dv" id="d-sales"></span></div>
          <div class="detail-row"><span class="dl">F &nbsp;進店業績</span><span class="dv" id="d-shop"></span></div>
          <div class="detail-row"><span class="dl">J &nbsp;額外收入</span><span class="dv" id="d-extra"></span></div>
        </div>
        <div>
          <div class="detail-col-title">支出項目</div>
          <div class="detail-row"><span class="dl">G &nbsp;補藥（自貼）</span><span class="dv" id="d-meds"></span></div>
          <div class="detail-row"><span class="dl">H &nbsp;茶水費</span><span class="dv" id="d-water"></span></div>
          <div class="detail-row"><span class="dl">I &nbsp;匯率</span><span class="dv" id="d-rate"></span></div>
        </div>
      </div>

      <div id="d-note-wrap" style="display:none;margin-top:4px">
        <div class="detail-col-title">L &nbsp;備註</div>
        <div class="note-box" id="d-note"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-danger btn-sm" onclick="deleteTour()">刪除</button>
        <button class="btn btn-sm" onclick="editTour()">編輯</button>
      </div>
    </div>
  </div>
</div>

<script>
const KEY = 'tour_guide_v1';
let tours = [], currentId = null, editingId = null;

function load() {
  try { tours = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { tours = []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(tours)); }

function calc(t) {
  const tips  = +t.tips  || 0;
  const sales = +t.sales || 0;
  const shop  = +t.shop  || 0;
  const meds  = +t.meds  || 0;
  const water = +t.water || 0;
  const extra = +t.extra || 0;
  const rate  = +t.rate  || 0.21;
  return tips + extra + (sales + shop - meds - water) * rate;
}

function fmt(n)    { return '$' + Math.round(n).toLocaleString(); }
function fmtJ(n)   { return '¥' + Math.round(+n || 0).toLocaleString(); }
function fmtR(r)   { return parseFloat(r).toFixed(3); }

function brkdown(t) {
  const tips  = +t.tips  || 0;
  const sales = +t.sales || 0;
  const shop  = +t.shop  || 0;
  const meds  = +t.meds  || 0;
  const water = +t.water || 0;
  const extra = +t.extra || 0;
  const rate  = +t.rate  || 0.21;
  const jpy   = sales + shop - meds - water;
  const jpyTwd = jpy * rate;
  const sign  = jpyTwd >= 0 ? '+' : '';
  let s = `小費 ${fmt(tips)}`;
  if (extra) s += ` + 額外 ${fmt(extra)}`;
  s += ` ${sign}${fmt(jpyTwd)} 日幣換算（¥${Math.round(jpy).toLocaleString()} × ${fmtR(rate)}）`;
  return s;
}

function showView(v, id) {
  ['list','form','detail'].forEach(x => document.getElementById('view-'+x).classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  const ta = document.getElementById('topbar-actions');
  load();
  if (v === 'list')   { renderList(); ta.innerHTML = '<button class="btn btn-sm" onclick="exportExcel()" style="margin-right:4px">↓ Excel</button><button class="btn btn-sm" onclick="exportPDF()" style="margin-right:6px">↓ PDF</button><button class="btn btn-primary btn-sm" onclick="showView(\'form\', null)">+ 新增團次</button>'; }
  if (v === 'form')   { editingId = id || null; renderForm(id); ta.innerHTML = ''; }
  if (v === 'detail') { currentId = id; renderDetail(id); ta.innerHTML = ''; }
}

function initYearFilter() {
  const years = [...new Set(tours.map(t => t.date ? t.date.slice(0,4) : '').filter(Boolean))].sort((a,b) => b-a);
  const sel = document.getElementById('filter-year');
  const curVal = sel.value;
  sel.innerHTML = '<option value="">全部年份</option>' + years.map(y => `<option value="${y}">${y}年</option>`).join('');
  // 預設選今年
  const thisYear = new Date().getFullYear().toString();
  if (!curVal) {
    sel.value = years.includes(thisYear) ? thisYear : (years[0] || '');
  } else {
    sel.value = curVal;
  }
}

function resetFilter() {
  const thisYear = new Date().getFullYear().toString();
  const sel = document.getElementById('filter-year');
  const years = [...sel.options].map(o => o.value).filter(Boolean);
  sel.value = years.includes(thisYear) ? thisYear : '';
  document.getElementById('filter-month').value = '';
  renderList();
}

function renderList() {
  const el = document.getElementById('tour-list');
  const ss = document.getElementById('stat-summary');
  if (!tours.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">✈️</div>還沒有紀錄<br>點右上角「新增團次」開始</div>';
    ss.style.display = 'none'; return;
  }
  initYearFilter();
  const filterYear  = document.getElementById('filter-year').value;
  const filterMonth = document.getElementById('filter-month').value;
  let filtered = [...tours];
  if (filterYear)  filtered = filtered.filter(t => t.date && t.date.slice(0,4) === filterYear);
  if (filterMonth) filtered = filtered.filter(t => t.date && t.date.slice(5,7) === filterMonth);
  const sorted = filtered.sort((a,b) => b.date.localeCompare(a.date));
  // 統計
  ss.style.display = filtered.length ? 'block' : 'none';
  const totalIncome = filtered.reduce((s,t) => s + calc(t), 0);
  document.getElementById('stat-count').textContent = filtered.length + ' 團';
  document.getElementById('stat-total').textContent = fmt(totalIncome);
  document.getElementById('stat-avg').textContent = filtered.length ? fmt(totalIncome / filtered.length) : '$0';
  // 標題
  let label = '所有團次';
  if (filterYear && filterMonth) label = `${filterYear} 年 ${parseInt(filterMonth)} 月`;
  else if (filterYear) label = `${filterYear} 年`;
  else if (filterMonth) label = `${parseInt(filterMonth)} 月`;
  document.getElementById('list-label').textContent = label;
  // 篩選結果提示
  const fr = document.getElementById('filter-result');
  if (filterYear || filterMonth) fr.textContent = `共 ${tours.length} 筆中顯示 ${filtered.length} 筆`;
  else fr.textContent = '';
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div>此條件無紀錄</div>';
    return;
  }
  el.innerHTML = sorted.map(t => `
    <div class="tour-item" onclick="showView('detail','${t.id}')">
      <div class="ti-left">
        <div class="ti-name">${t.name || '未命名團次'}</div>
        <div class="ti-meta">${t.date || '—'}　·　${t.pax || 0} 人</div>
      </div>
      <div class="ti-right">
        <div class="ti-amount">${fmt(calc(t))}</div>
        <div class="ti-currency">TWD</div>
      </div>
    </div>`).join('');
}

function renderForm(id) {
  const t = id ? tours.find(x => x.id === id) : {};
  ['date','name','pax','tips','sales','shop','meds','water','extra','note'].forEach(k => {
    document.getElementById('f-' + k).value = t?.[k] ?? '';
  });
  document.getElementById('f-rate').value = t?.rate ?? '0.21';
  updateCalc();
  ['tips','sales','shop','meds','water','extra','rate'].forEach(k => {
    document.getElementById('f-' + k).oninput = updateCalc;
  });
}

function updateCalc() {
  const t = { tips: document.getElementById('f-tips').value, sales: document.getElementById('f-sales').value, shop: document.getElementById('f-shop').value, meds: document.getElementById('f-meds').value, water: document.getElementById('f-water').value, extra: document.getElementById('f-extra').value, rate: document.getElementById('f-rate').value };
  document.getElementById('f-total').textContent = fmt(calc(t));
  document.getElementById('f-breakdown').textContent = brkdown(t);
}

function saveTour() {
  const t = { id: editingId || Date.now().toString() };
  ['date','name','pax','tips','sales','shop','meds','water','extra','rate','note'].forEach(k => {
    t[k] = document.getElementById('f-' + k).value;
  });
  if (!t.name && !t.date) { alert('請至少填入團名或日期'); return; }
  load();
  if (editingId) { const i = tours.findIndex(x => x.id === editingId); if (i >= 0) tours[i] = t; }
  else tours.push(t);
  save(); showView('list');
}

function renderDetail(id) {
  load();
  const t = tours.find(x => x.id === id);
  if (!t) { showView('list'); return; }
  document.getElementById('d-name').textContent = t.name || '未命名團次';
  document.getElementById('d-meta').textContent = (t.date || '—') + '　·　' + (t.pax || 0) + ' 人';
  document.getElementById('d-total').textContent = fmt(calc(t));
  document.getElementById('d-breakdown').textContent = brkdown(t);
  document.getElementById('d-tips').textContent   = fmt(+t.tips || 0) + ' TWD';
  document.getElementById('d-sales').textContent  = fmtJ(t.sales);
  document.getElementById('d-shop').textContent   = fmtJ(t.shop);
  document.getElementById('d-extra').textContent  = fmt(+t.extra || 0) + ' TWD';
  document.getElementById('d-meds').textContent   = fmtJ(t.meds);
  document.getElementById('d-water').textContent  = fmtJ(t.water);
  document.getElementById('d-rate').textContent   = '1 JPY = ' + fmtR(t.rate || 0.21) + ' TWD';
  const nw = document.getElementById('d-note-wrap');
  if (t.note) { nw.style.display = 'block'; document.getElementById('d-note').textContent = t.note; }
  else nw.style.display = 'none';
}

function editTour()   { showView('form', currentId); }
function deleteTour() {
  if (!confirm('確定要刪除這筆紀錄？此動作無法復原。')) return;
  load(); tours = tours.filter(x => x.id !== currentId); save(); showView('list');
}

function exportExcel() {
  load();
  if (!tours.length) { alert('目前沒有資料可以匯出'); return; }
  const sorted = [...tours].sort((a,b) => a.date.localeCompare(b.date));
  const rows = [['帶團日期','團名','團員人數','D 小費(TWD)','E 車販業績(JPY)','F 進店業績(JPY)','G 補藥(JPY)','H 茶水費(JPY)','I 匯率','J 額外收入(TWD)','K 總收入(TWD)','L 備註']];
  sorted.forEach(t => {
    rows.push([t.date||'', t.name||'', +t.pax||0, +t.tips||0, +t.sales||0, +t.shop||0, +t.meds||0, +t.water||0, +t.rate||0.21, +t.extra||0, Math.round(calc(t)), t.note||'']);
  });
  const total = tours.reduce((s,t)=>s+calc(t),0);
  rows.push(['','','合計','','','','','','','',Math.round(total),'']);
  let csv = '\uFEFF';
  rows.forEach(r => { csv += r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',') + '\n'; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '帶團記帳_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

function exportPDF() {
  load();
  if (!tours.length) { alert('目前沒有資料可以匯出'); return; }
  const sorted = [...tours].sort((a,b) => a.date.localeCompare(b.date));
  const total = tours.reduce((s,t)=>s+calc(t),0);
  const avg = total / tours.length;
  const today = new Date().toLocaleDateString('zh-TW');
  let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
    body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;font-size:12px;color:#1a1916;padding:32px}
    h1{font-size:20px;margin-bottom:4px}.sub{color:#888;font-size:12px;margin-bottom:24px}
    .stat{display:flex;gap:24px;margin-bottom:24px}
    .stat-item{background:#f5f2ec;padding:10px 16px;border-radius:8px}
    .stat-item .sl{font-size:10px;color:#888}.stat-item .sv{font-size:18px;font-weight:700}
    table{width:100%;border-collapse:collapse;font-size:11px}
    th{background:#1a1916;color:#fff;padding:7px 8px;text-align:left}
    td{padding:6px 8px;border-bottom:1px solid #e5e2db}
    tr:nth-child(even) td{background:#f9f8f5}
    .total-row td{font-weight:700;background:#f5f2ec;border-top:2px solid #1a1916}
    .num{text-align:right;font-family:monospace}
    @media print{body{padding:16px}}
  </style></head><body>
  <h1>帶團記帳報表</h1>
  <div class="sub">匯出日期：${today}　·　共 ${tours.length} 團</div>
  <div class="stat">
    <div class="stat-item"><div class="sl">總收入</div><div class="sv">$${Math.round(total).toLocaleString()} TWD</div></div>
    <div class="stat-item"><div class="sl">平均每團</div><div class="sv">$${Math.round(avg).toLocaleString()} TWD</div></div>
  </div>
  <table><tr><th>日期</th><th>團名</th><th>人數</th><th class="num">D小費</th><th class="num">E車販</th><th class="num">F進店</th><th class="num">G補藥</th><th class="num">H茶水</th><th class="num">J額外</th><th class="num">匯率</th><th class="num">K總收入</th><th>備註</th></tr>`;
  sorted.forEach(t => {
    html += `<tr><td>${t.date||'—'}</td><td>${t.name||'—'}</td><td class="num">${+t.pax||0}</td><td class="num">${(+t.tips||0).toLocaleString()}</td><td class="num">¥${(+t.sales||0).toLocaleString()}</td><td class="num">¥${(+t.shop||0).toLocaleString()}</td><td class="num">¥${(+t.meds||0).toLocaleString()}</td><td class="num">¥${(+t.water||0).toLocaleString()}</td><td class="num">${(+t.extra||0).toLocaleString()}</td><td class="num">${parseFloat(t.rate||0.21).toFixed(3)}</td><td class="num">$${Math.round(calc(t)).toLocaleString()}</td><td>${t.note||''}</td></tr>`;
  });
  html += `<tr class="total-row"><td colspan="10">合計</td><td class="num">$${Math.round(total).toLocaleString()}</td><td></td></tr></table></body></html>`;
  const w = window.open('','_blank','width=1000,height=700');
  w.document.write(html); w.document.close();
  setTimeout(() => w.print(), 600);
}

showView('list');
</script>
